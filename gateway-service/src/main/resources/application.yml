server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: content
          uri: ${CONTENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/content/**
        - id: learning
          uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/learning/**

jwt:
  secret: ${JWT_SECRET:LmAxBynYUYDh9uLxzGYCHCGSIVceE2E87aLSRtVVgAGxLlHtbz6Hn3TMP4DwYfPyjEfwUlKopDnLKnB4UpTexV}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

rate-limit:
  requests-per-second: ${RATE_LIMIT_RPS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
