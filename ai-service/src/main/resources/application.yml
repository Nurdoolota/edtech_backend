server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ai-service
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:qwerty}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

llm:
  api-base-url: ${LLM_API_BASE_URL:http://localhost:1234/v1}
  model: ${LLM_MODEL:local-model}
  api-key: ${LLM_API_KEY:lm-studio}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:28}

ai:
  max-retries: ${AI_MAX_RETRIES:3}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
  provider: ${AI_PROVIDER:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
