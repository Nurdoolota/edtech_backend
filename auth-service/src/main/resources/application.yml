server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:qwerty}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

flyway:
  enabled: true
  locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:LmAxBynYUYDh9uLxzGYCHCGSIVceE2E87aLSRtVVgAGxLlHtbz6Hn3TMP4DwYfPyjEfwUlKopDnLKnB4UpTexV}
  access-expiry-seconds: ${JWT_EXPIRY_SECONDS:900}
  refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}

management:
  endpoints:
    web:
      exposure:
        include: health,info
