server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:qwerty}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

flyway:
  enabled: true
  locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:LmAxBynYUYDh9uLxzGYCHCGSIVceE2E87aLSRtVVgAGxLlHtbz6Hn3TMP4DwYfPyjEfwUlKopDnLKnB4UpTexV}
  access-expiry-seconds: ${JWT_EXPIRY_SECONDS:900}
  refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}

avatar:
  max-size-mb: ${AVATAR_MAX_SIZE_MB:2}
  storage-path: ${AVATAR_STORAGE_PATH:./data/avatars}

email:
  provider: console
  from: noreply@lms-english.local
  frontend-url: http://localhost:3000

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
